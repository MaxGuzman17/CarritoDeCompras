<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <title>GAMERS ZONE</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="fixed-top">
        <nav class="navbar bg-dark border-bottom border-body">
            <div class="container">
                <img src="../assets/img/logo.webp" alt="Pagina" class="logoHeader">
        </nav>
    </header>
    <main class="container flex-grow-1">
        <div class="container my-5">
            <div class="d-flex align-items-center gap-3 mb-5">
                <div class="d-flex align-items-center gap-3">
                    <a href="../index.html">
                        <button class="btn btn-outline-danger">
                            <i class="bi bi-chevron-left"></i>
                        </button>
                    </a>
                    <div class="col">
                        <h1 class="fw-bold mb-1 text-light">Mi Carrito</h1>
                    </div>
                </div>
            </div>


            <div class="row">
                <!-- LISTA DE PRODUCTOS -->
                <div class="col-lg-8" id="productoEnCarrito">
                    <!-- aca se cargan los productos carrito -->
                </div>

                <!-- RESUMEN -->
                <div class="col-lg-4">
                    <div class="sticky-top" style="top: 200px;">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title mb-4">Resumen de compra</h5>

                                <div class="d-flex justify-content-between mb-2">
                                    <span><span id="cantidadProductos">0</span> Productos</span>
                                    <span id="subtotal">$0</span>
                                </div>

                                <div class="d-flex justify-content-between mb-2">
                                    <span>Envío</span>
                                    <span class="text-success">Gratis</span>
                                </div>

                                <hr>

                                <div class="d-flex justify-content-between mb-4">
                                    <span class="h5">Total</span>
                                    <span class="h5 fw-bold" id="total">$0</span>
                                </div>

                                <button class="btn btn-danger w-100 btn-lg shadow-sm mb-4">
                                    <i class="bi bi-cart3 me-2"></i>
                                    Finalizar Compra
                                </button>

                                <a href="../index.html">
                                    <button class="btn btn-outline-danger w-100 btn-lg shadow-sm">
                                        Ver más Productos
                                    </button>
                                </a>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light mt-5 border-top border-secondary">
        <div class="container py-4">
            <div class="row text-center text-md-start align-items-center">
                <!-- Marca -->
                <div class="col-md-4 mb-3 mb-md-0">
                    <h5 class="fw-bold">Gamers Zone</h5>
                    <p class="mb-0 small">
                        Tu tienda online de componentes PC.<br>
                        Calidad, rendimiento y confianza.
                    </p>
                </div>

                <!-- Links -->
                <div class="col-md-4 mb-3 mb-md-0">
                    <h6 class="fw-bold">Secciones</h6>
                    <ul class="list-unstyled mb-0">
                        <li><a href="#" class="text-light text-decoration-none">Inicio</a></li>
                        <li><a href="#" class="text-light text-decoration-none">Productos</a></li>
                        <li><a href="#" class="text-light text-decoration-none">Carrito</a></li>
                        <li><a href="#" class="text-light text-decoration-none">Contacto</a></li>
                    </ul>
                </div>

                <!-- Redes -->
                <div class="col-md-4">
                    <h6 class="fw-bold">Seguinos</h6>
                    <a href="#" class="text-light me-3 fs-5"><i class="bi bi-instagram"></i></a>
                    <a href="#" class="text-light me-3 fs-5"><i class="bi bi-facebook"></i></a>
                    <a href="#" class="text-light fs-5"><i class="bi bi-twitter-x"></i></a>
                </div>
            </div>

            <hr class="border-secondary my-3">
            <div class="text-center small">
                © 2026 TechStore — Todos los derechos reservados
            </div>
        </div>
    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/carrito.js"></script>
</body>

</html>
