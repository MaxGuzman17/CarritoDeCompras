<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>GAMERS ZONE</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="fixed-top">
        <nav class="navbar bg-dark border-bottom border-body">
            <div class="container">
                <img src="./assets/img/logo.webp" alt="Pagina" class="logoHeader">
                <form class="d-flex w-50 w-md-25" role="search" id="formBuscador">
                    <div class="input-group">
                        <input id="buscador" class="form-control form-control-lg" type="search"
                            placeholder="Buscar productos" aria-label="Search">
                        <button class="btn btn-outline-light" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
                <a href="./pages/carrito.html"><button class="btn btn-outline-danger position-relative"><i
                            class="bi bi-cart3"></i><span id="badgeCarrito"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"></span></button></a>
            </div>
        </nav>
    </header>
    <main class="container flex-grow-1">
        <div class="row row-cols-1 row-cols-md-3 g-4" id="contenedorProductos">
            <!-- aca se cargan los productos -->
        </div>

        <!-- Modal cuando se agrega algo al carrito -->
        <div class="modal fade" id="modalCarrito" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content bg-dark text-light border-secondary">
                    <div class="modal-header border-secondary">
                        <h5 class="modal-title">
                            <i class="bi bi-cart-check text-danger me-2"></i>
                            Producto agregado
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p class="mb-0">
                            <strong id="nombreProductoModal"></strong>
                            se agregó correctamente al carrito.
                        </p>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button class="btn btn-outline-danger" data-bs-dismiss="modal">
                            Seguir comprando
                        </button>
                        <a href="./pages/carrito.html" class="btn btn-danger">
                            Ir al carrito
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light mt-5 border-top border-secondary">
        <div class="container py-4">
            <div class="row text-center text-md-start align-items-center">
                <!-- Marca -->
                <div class="col-md-4 mb-3 mb-md-0">
                    <h5 class="fw-bold">Gamers Zone</h5>
                    <p class="mb-0 small">
                        Tu tienda online de componentes PC.<br>
                        Calidad, rendimiento y confianza.
                    </p>
                </div>

                <!-- Links -->
                <div class="col-md-4 mb-3 mb-md-0">
                    <h6 class="fw-bold">Secciones</h6>
                    <ul class="list-unstyled mb-0">
                        <li><a href="#" class="text-light text-decoration-none">Inicio</a></li>
                        <li><a href="#" class="text-light text-decoration-none">Productos</a></li>
                        <li><a href="#" class="text-light text-decoration-none">Carrito</a></li>
                        <li><a href="#" class="text-light text-decoration-none">Contacto</a></li>
                    </ul>
                </div>

                <!-- Redes -->
                <div class="col-md-4">
                    <h6 class="fw-bold">Seguinos</h6>
                    <a href="#" class="text-light me-3 fs-5"><i class="bi bi-instagram"></i></a>
                    <a href="#" class="text-light me-3 fs-5"><i class="bi bi-facebook"></i></a>
                    <a href="#" class="text-light fs-5"><i class="bi bi-twitter-x"></i></a>
                </div>
            </div>

            <hr class="border-secondary my-3">

            <div class="text-center small">
                © 2026 TechStore — Todos los derechos reservados
            </div>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./assets/js/main.js"></script>


</body>

</html>
